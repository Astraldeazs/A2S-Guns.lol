<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2S | Astrofa</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/fond.css">
    <link rel="stylesheet" href="css/carte.css">
    <link rel="stylesheet" href="css/glow.css">
    <link rel="stylesheet" href="css/neon.css">
    <link rel="stylesheet" href="css/visualiseur.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("assets/background.jpg") center center/cover no-repeat;
            color: white;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(5px);
        }

        body::after {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle, #ff00b730 0%, transparent 30%),
                radial-gradient(circle, #ff00b720 0%, transparent 40%);
            animation: bgPulse 10s infinite alternate;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            cursor: pointer;
            transition: .7s;
        }

        .enter-content {
            text-align: center;
        }

        /* Style épuré pour le texte d'entrée */
        #enter-screen h1 {
            font-size: 2.5rem;
            font-weight: 400; /* Style plus léger et accueillant */
            color: #ffffff;    /* Blanc pur */
            text-shadow: none; /* Plus aucun effet de glow */
        }

        .container {
            position: relative;
            z-index: 2;
            width: 95%;
            height: 90vh;
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 25px;
        }

        .card {
            background: rgba(0, 0, 0, .35);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 25px;
            padding: 25px;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow:
                0 0 30px rgba(255, 0, 183, .5),
                0 0 60px rgba(255, 0, 183, .2);
        }

        .left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .logo {
            width: 180px;
            filter: drop-shadow(0 0 25px #ff00b7);
        }

        .discord {
            padding: 15px 25px;
            background: #ff00b7;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            transition: .3s;
        }

        .discord:hover {
            transform: scale(1.05);
        }

        .center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pfp {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff00b7;
            animation:
                float 4s infinite ease-in-out,
                pulseGlow 3s infinite alternate;
        }

        @keyframes float {
            50% { transform: translateY(-15px); }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 20px #ff00b7; }
            to {
                box-shadow:
                    0 0 50px #ff00b7,
                    0 0 100px #ff00b7,
                    0 0 150px #ff00b7;
            }
        }

        .name {
            margin-top: 20px;
            font-size: 5rem;
            font-weight: 700;
            text-shadow:
                0 0 10px #ff00b7,
                0 0 30px #ff00b7,
                0 0 60px #ff00b7;
            animation: textGlow 3s infinite alternate;
        }

        @keyframes textGlow {
            from { filter: brightness(1); }
            to { filter: brightness(1.5); }
        }

        .subtitle {
            opacity: .8;
            font-size: 1.2rem;
        }

        .right {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .music-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .track {
            font-weight: 600;
            text-align: center;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            height: 100px;
        }

        .visualizer span {
            width: 7px;
            background: #ff00b7;
            border-radius: 999px;
            box-shadow:
                0 0 10px #ff00b7,
                0 0 20px #ff00b7,
                0 0 40px #ff00b7;
            animation: sound 1s infinite ease-in-out;
        }

        .visualizer span:nth-child(1) { animation-delay: .1s; }
        .visualizer span:nth-child(2) { animation-delay: .5s; }
        .visualizer span:nth-child(3) { animation-delay: .2s; }
        .visualizer span:nth-child(4) { animation-delay: .7s; }
        .visualizer span:nth-child(5) { animation-delay: .3s; }
        .visualizer span:nth-child(6) { animation-delay: .8s; }
        .visualizer span:nth-child(7) { animation-delay: .4s; }
        .visualizer span:nth-child(8) { animation-delay: .6s; }

        @keyframes sound {
            0% { height: 10px; }
            50% { height: 90px; }
            100% { height: 15px; }
        }

        audio {
            display: none;
        }

        @media(max-width:900px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                overflow: auto;
                padding: 20px;
            }

            body {
                overflow: auto;
            }

            .name {
                font-size: 3rem;
            }
            
            #enter-screen h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div id="enter-screen">
        <div class="enter-content">
            <h1>Click To Enter</h1>
        </div>
    </div>

    <div class="container">

        <div class="card left">
            <img src="assets/logo.png" class="logo">
            <h2>Projet Astrofa</h2>
            <a href="https://discord.gg/astrofa" class="discord">
                Discord Astrofa
            </a>
        </div>

        <div class="center">
            <img src="assets/pfp.png" class="pfp">
            <div class="name">Astro FA</div>
            <div class="subtitle">
                Astrofa Community
            </div>
        </div>

        <div class="card right">
            <div class="music-box">
                <h2>♫ En écoute</h2>
                <div class="track">
                    Mister You - Mardi 30 juin
                </div>

                <div class="visualizer">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <audio id="music" loop>
                    <source src="assets/music.mp4" type="audio/mp4">
                </audio>
            </div>
        </div>

    </div>

    <script>
        const enter = document.getElementById("enter-screen");
        const music = document.getElementById("music");

        enter.addEventListener("click", () => {
            music.volume = 0.5;
            music.play();
            enter.style.opacity = "0";
            setTimeout(() => {
                enter.remove();
            }, 700);
        });
    </script>

</body>
</html>
